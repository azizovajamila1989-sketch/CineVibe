<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVibe</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07050d;--panel:#130d1d;--accent:#d4a548;--accent2:#f0cf86;--velvet:#a23a62;--text:#f6f1e7;--dim:#9d92a6;--line:rgba(246,241,231,.09);--danger:#ee5a74;--f:'Fraunces',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 10% -5%,rgba(162,58,98,.30),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(212,165,72,.12),transparent 55%),var(--bg);background-attachment:fixed;color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.sidebar{width:236px;background:rgba(13,9,22,.85);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;font:600 23px var(--f);padding:0 8px 24px;cursor:pointer}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--velvet));display:grid;place-items:center;font-style:normal;font-size:13px;color:#0a0710;box-shadow:0 6px 18px rgba(212,165,72,.4)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--dim);font-size:14px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(212,165,72,.18),transparent);border-left-color:var(--accent);color:#fff}
.nav-item .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:10px}
.nav-label{font-size:11px;color:var(--dim);padding:0 12px;margin:18px 0 8px;letter-spacing:.8px;text-transform:uppercase}
.side-foot{margin-top:auto;padding:14px 10px;font:italic 14px/1.4 var(--f);color:var(--accent2)}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 32px;position:sticky;top:0;z-index:20;background:rgba(7,5,13,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 16px;transition:.15s}
.search:focus-within{border-color:rgba(212,165,72,.6);box-shadow:0 0 0 4px rgba(212,165,72,.1)}
.search input{background:none;border:0;outline:0;color:var(--text);font-size:14px;width:100%}
.ibtn{height:40px;padding:0 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:13px;white-space:nowrap;transition:.15s}
.ibtn:hover{border-color:var(--accent)}
.btn{background:linear-gradient(90deg,var(--accent),var(--velvet));color:#16090e;border:0;padding:12px 24px;border-radius:24px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:.15s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(212,165,72,.3)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff}
.btn.ghost:hover{box-shadow:none;background:rgba(255,255,255,.14)}
.btn.fav{background:rgba(238,90,116,.2);border-color:rgba(238,90,116,.6);color:#ffb0bf}
.mnav{display:none;gap:8px;overflow-x:auto;padding:12px 16px 0}
.mnav .chip{flex-shrink:0}
.content{padding:26px 32px 70px}
.hero{position:relative;height:500px;border-radius:26px;overflow:hidden;margin-bottom:38px;border:1px solid var(--line);box-shadow:0 30px 70px -25px #000}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;align-items:flex-end}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,5,13,.97) 18%,rgba(7,5,13,.5) 55%,rgba(7,5,13,.05)),linear-gradient(0deg,rgba(7,5,13,.7),transparent 45%)}
.hero-in{position:relative;z-index:2;padding:48px;max-width:560px}
.badge{display:inline-block;background:rgba(212,165,72,.15);border:1px solid rgba(212,165,72,.45);color:var(--accent2);font-size:12px;padding:5px 14px;border-radius:20px;margin-bottom:16px}
.hero-in h1{font:700 50px/1.05 var(--f);margin-bottom:14px}
.hero-in p{color:#d3c8d6;font-size:15px;line-height:1.6;margin-bottom:24px}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.dots{position:absolute;bottom:22px;right:36px;z-index:3;display:flex;gap:8px}
.dots span{width:22px;height:5px;border-radius:4px;background:rgba(255,255,255,.28);cursor:pointer;transition:.2s}
.dots span.on{background:var(--accent2);width:34px}
.sec{margin-bottom:34px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-h h2{font:600 22px var(--f)}
.link{color:var(--accent2);font-size:13px;cursor:pointer}
.link:hover{text-decoration:underline}
.scroller{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#3a2d4d transparent}
.scroller .card{width:170px;flex-shrink:0;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:18px}
.card{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;border:1px solid var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(212,165,72,.5);box-shadow:0 22px 40px -12px #000,0 0 30px -8px rgba(212,165,72,.4)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.card:hover img{transform:scale(1.07)}
.card .ov{position:absolute;inset:0;background:rgba(7,5,13,.5);display:grid;place-items:center;opacity:0;transition:.25s}
.card:hover .ov{opacity:1}
.play{width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#16090e;font-size:18px;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:.2s}
.play:hover{transform:scale(1.12)}
.fb{position:absolute;top:9px;right:9px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(7,5,13,.65);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:15px;display:grid;place-items:center}
.fb.on{background:var(--danger);border-color:transparent}
.tag{position:absolute;top:9px;left:9px;z-index:2;font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:6px;background:rgba(7,5,13,.7);color:var(--accent2);border:1px solid rgba(212,165,72,.35)}
.info{position:absolute;left:0;right:0;bottom:0;padding:30px 11px 10px;background:linear-gradient(transparent,rgba(5,3,9,.95))}
.info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info span{font-size:11px;color:var(--dim)}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vh h1{font:700 30px var(--f)}
.vh .sub{color:var(--dim);font-size:13px;margin-top:4px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;outline:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:8px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{color:var(--text);border-color:rgba(212,165,72,.45)}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--velvet));color:#16090e;font-weight:700;border-color:transparent}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.gt{padding:28px 20px;border-radius:16px;background:linear-gradient(135deg,rgba(212,165,72,.16),rgba(19,13,29,.6));border:1px solid var(--line);cursor:pointer;transition:.2s}
.gt:hover{transform:translateY(-4px);border-color:var(--accent2)}
.gt .i{font-size:28px;margin-bottom:10px}.gt b{display:block;font-size:17px}.gt span{font-size:12px;color:var(--dim)}
.empty{text-align:center;padding:70px 20px;color:var(--dim)}.empty .big{font-size:42px;margin-bottom:10px}.empty .btn{margin-top:18px}
.mo{position:fixed;inset:0;background:rgba(4,2,8,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;overflow-y:auto}
.mo.open{display:flex}
.mb{width:100%;max-width:920px;max-height:92vh;overflow-y:auto;background:#0e0916;border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 90px -20px #000;position:relative;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.98)}}
.x{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px}
.x:hover{background:rgba(255,255,255,.2)}
.vid{position:relative;padding-top:50%;background:#000;overflow:hidden}
.vid img,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;object-position:center 20%}
.vid:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0e0916,transparent 60%);pointer-events:none}
.vid.live:after{display:none}
.vid .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:76px;height:76px;font-size:26px}
.det{padding:6px 30px 30px}
.det h2{font:700 32px var(--f);margin-bottom:8px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.meta span{font-size:12px;padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.07);color:var(--accent2)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.det h3{font:600 18px var(--f);margin-bottom:12px}
#login .mb{max-width:390px}
#login form{padding:26px}#login h3{font:700 22px var(--f);margin-bottom:16px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);outline:0}
.fld input:focus{border-color:var(--accent2)}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:#1c1426;border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.sidebar{display:none}.mnav{display:flex}.content{padding:18px 16px 60px}.topbar{padding:12px 16px}.hero{height:380px}.hero-in{padding:26px}.hero-in h1{font-size:32px}.det{padding:6px 18px 24px}.scroller .card{width:140px}#authBtn{display:none}}
</style>
</head>

const MOVIES=RAW.trim().split("\n").map((l,i)=>{const[t,y,g,ty,p,yt]=l.split("|");return{id:"m"+i,title:t,year:+y,genre:G[g][0],type:ty=="m"?"movie":"series",poster:p=="-"?"":"https://image.tmdb.org/t/p/w400/"+p+".jpg",yt}});
const GENRES=Object.values(G).map(([key,icon])=>({key,icon}));
const HERO=["John Wick","Oppenheimer","Dune","Stranger Things"];
const HERO_TXT={"John Wick":"O'limga qasamyod qilgan afsonaviy qotilning hikoyasi. Adrenalin va kuchli syujet!","Oppenheimer":"Atom bombasi otasining hayoti va ilmiy kashfiyoti ortidagi og'ir tanlovlar.","Dune":"Cho'l sayyorasida hokimiyat, taqdir va sirli kuchlar uchun kurash.","Stranger Things":"Kichik shaharchada boshlangan g'alati voqealar — do'stlik va noma'lum dunyo."};

/* === YOUTUBE URL'lar === */
const watchURL=m=>`https://www.youtube.com/watch?v=${m.yt}`;
const searchURL=m=>`https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+" "+m.year+" full movie")}`;
const openYT=id=>{const m=byId(id);addHistory(id);window.open(watchURL(m),"_blank","noopener")};

const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
let fav=new Set(ls("cv2_fav",[])),hist=ls("cv2_hist",[]),S={view:"home",genre:null,q:"",hero:0,sort:"def",user:ls("cv2_user",null)};
const byId=id=>MOVIES.find(m=>m.id===id);
const $=id=>document.getElementById(id);
const ph=t=>"https://placehold.co/400x600/130d1d/9d92a6?text="+encodeURIComponent(t);
const big=m=>m.poster?m.poster.replace("w400","original"):ph(m.title);
const save=()=>{try{localStorage.setItem("cv2_fav",JSON.stringify([...fav]));localStorage.setItem("cv2_hist",JSON.stringify(hist))}catch(e){}};

const NAV=[["home","🏠","Bosh sahifa"],["movies","🎬","Filmlar"],["series","📺","Seriallar"],["genres","🔲","Janrlar"],["favorites","❤️","Sevimlilar"],["history","🕐","Tarix"]];
function renderNav(){
  $("mainNav").innerHTML=NAV.map(([k,i,l])=>`<div class="nav-item ${S.view===k?'active':''}" onclick="goTo('${k}')"><span>${i}</span>${l}${k=="favorites"?`<span class="count">${fav.size}</span>`:k=="history"?`<span class="count">${hist.length}</span>`:""}</div>`).join("");
  $("genreNav").innerHTML=GENRES.map(g=>`<div class="nav-item ${S.view=="genre"&&S.genre==g.key?'active':''}" onclick="openGenre('${g.key}')"><span>${g.icon}</span>${g.key}</div>`).join("");
  $("mnav").innerHTML=NAV.map(([k,i,l])=>`<div class="chip ${S.view===k?'on':''}" onclick="goTo('${k}')">${i} ${l}</div>`).join("");
}
function goTo(v){S.view=v;S.genre=null;S.sort="def";clearSearch(true);scrollTo({top:0,behavior:"smooth"});render()}
function openGenre(g){S.view="genre";S.genre=g;S.sort="def";clearSearch(true);scrollTo({top:0,behavior:"smooth"});render()}

function card(m){const f=fav.has(m.id);return `<div class="card" onclick="openDetail('${m.id}')">
  <span class="tag">${m.type=="movie"?"FILM":"SERIAL"}</span>
  <div class="fb ${f?'on':''}" onclick="toggleFav(event,'${m.id}')">${f?'♥':'♡'}</div>
  <img src="${m.poster||ph(m.title)}" alt="${m.title}" loading="lazy" onerror="this.onerror=null;this.src='${ph(m.title)}'">
  <div class="ov"><button class="play" title="YouTube'da ochish" onclick="event.stopPropagation();openYT('${m.id}')">▶</button></div>
  <div class="info"><b>${m.title}</b><span>${m.year} • ${m.genre}</span></div></div>`}
const grid=l=>l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty"><div class="big">🔍</div>Hech narsa topilmadi<br><button class="btn" onclick="goTo('home')">Bosh sahifa</button></div>`;
function sorted(l){const a=[...l];if(S.sort=="new")a.sort((x,y)=>y.year-x.year);if(S.sort=="old")a.sort((x,y)=>x.year-y.year);if(S.sort=="az")a.sort((x,y)=>x.title.localeCompare(y.title));return a}
const sortSel=()=>`<select onchange="S.sort=this.value;render()"><option value="def">Saralash: Oddiy</option><option value="new" ${S.sort=="new"?"selected":""}>Yangi avval</option><option value="old" ${S.sort=="old"?"selected":""}>Eski avval</option><option value="az" ${S.sort=="az"?"selected":""}>A → Z</option></select>`;
const head=(t,s,x="")=>`<div class="vh"><div><h1>${t}</h1><div class="sub">${s}</div></div>${x}</div>`;
const chips=base=>`<div class="chips"><div class="chip ${S.view==base?'on':''}" onclick="goTo('${base}')">Barchasi</div>${GENRES.map(g=>`<div class="chip" onclick="openGenre('${g.key}')">${g.icon} ${g.key}</div>`).join("")}</div>`;
const row=(t,l,go)=>`<section class="sec"><div class="sec-h"><h2>${t}</h2>${go?`<span class="link" onclick="${go}">Barchasi ›</span>`:""}</div><div class="scroller">${l.map(card).join("")}</div></section>`;

function render(){
  renderNav();const c=$("content");
  if(S.q){const q=S.q.toLowerCase(),r=MOVIES.filter(m=>m.title.toLowerCase().includes(q)||m.genre.toLowerCase().includes(q)||String(m.year)==q);
    c.innerHTML=head(`"${S.q}"`,`${r.length} ta natija`)+grid(r);return}
  if(S.view=="home"){
    c.innerHTML=`<section class="hero" id="hero"></section>`+row("🔥 Trendda",MOVIES.slice(0,14))+row("📺 Seriallar",MOVIES.filter(m=>m.type=="series").slice(0,14),"goTo('series')")+
      GENRES.slice(0,5).map(g=>row(g.icon+" "+g.key,MOVIES.filter(m=>m.genre==g.key).slice(0,14),`openGenre('${g.key}')`)).join("");
    renderHero();return}
  if(S.view=="movies"||S.view=="series"){const l=MOVIES.filter(m=>m.type==(S.view=="movies"?"movie":"series"));
    c.innerHTML=head(S.view=="movies"?"Filmlar":"Seriallar",l.length+" ta",sortSel())+chips(S.view)+grid(sorted(l));return}
  if(S.view=="genres"){c.innerHTML=head("Janrlar","Janr bo'yicha ko'ring")+`<div class="gg">${GENRES.map(g=>`<div class="gt" onclick="openGenre('${g.key}')"><div class="i">${g.icon}</div><b>${g.key}</b><span>${MOVIES.filter(m=>m.genre==g.key).length} ta kontent</span></div>`).join("")}</div>`;return}
  if(S.view=="genre"){const l=MOVIES.filter(m=>m.genre==S.genre);c.innerHTML=head(S.genre,l.length+" ta kontent",sortSel())+grid(sorted(l));return}
  if(S.view=="favorites"){const l=MOVIES.filter(m=>fav.has(m.id));c.innerHTML=head("Sevimlilar",l.length+" ta saqlangan")+(l.length?grid(l):`<div class="empty"><div class="big">🤍</div>Hali sevimlilar yo'q<br><button class="btn" onclick="goTo('home')">Filmlarni ko'rish</button></div>`);return}
  if(S.view=="history"){const l=hist.map(byId).filter(Boolean);c.innerHTML=head("Tarix",l.length+" ta ko'rilgan",l.length?`<span class="link" onclick="hist=[];save();toast('Tarix tozalandi');render()">Tarixni tozalash</span>`:"")+(l.length?grid(l):`<div class="empty"><div class="big">🕐</div>Tarix bo'sh<br><button class="btn" onclick="goTo('home')">Boshlash</button></div>`)}
}

let ht;
function renderHero(){
  const h=$("hero");if(!h)return;
  h.innerHTML=HERO.map((t,i)=>{const m=MOVIES.find(x=>x.title==t);return `<div class="slide ${i==S.hero?'on':''}"><img src="${big(m)}" alt="${t}" onerror="this.onerror=null;this.src='${ph(t)}'"><div class="hero-in"><span class="badge">✦ Hozir mashhur • ${m.year} • ${m.genre}</span><h1>${t}</h1><p>${HERO_TXT[t]}</p><div class="hero-btns"><button class="btn" onclick="openYT('${m.id}')">▶ YouTube'da ko'rish</button><button class="btn ghost" onclick="openDetail('${m.id}')">ⓘ Batafsil</button><button class="btn ghost ${fav.has(m.id)?'fav':''}" onclick="toggleFav(event,'${m.id}')">${fav.has(m.id)?'♥ Sevimli':'♡ Sevimli'}</button></div></div></div>`}).join("")+`<div class="dots">${HERO.map((_,i)=>`<span class="${i==S.hero?'on':''}" onclick="S.hero=${i};renderHero()"></span>`).join("")}</div>`;
  clearInterval(ht);ht=setInterval(()=>{S.hero=(S.hero+1)%HERO.length;if(S.view=="home"&&!S.q&&$("hero"))renderHero()},7000);
}

function openDetail(id){
  const m=byId(id),f=fav.has(id),sim=MOVIES.filter(x=>x.genre==m.genre&&x.id!=id).slice(0,12);
  $("detailBox").innerHTML=`<button class="x" onclick="closeDetail()">✕</button>
  <div class="vid" id="vid"><img src="${big(m)}" onerror="this.onerror=null;this.src='${ph(m.title)}'"><button class="play" onclick="playInline('${id}')">▶</button></div>
  <div class="det"><h2>${m.title}</h2><div class="meta"><span>${m.year}</span><span>${m.genre}</span><span>${m.type=="movie"?"Film":"Serial"}</span></div>
  <div class="acts"><a class="btn" href="${watchURL(m)}" target="_blank" rel="noopener" onclick="addHistory('${id}')">▶ YouTube'da ochish</a>
  <a class="btn ghost" href="${searchURL(m)}" target="_blank" rel="noopener">🔎 To'liq filmni qidirish</a>
  <button class="btn ghost ${f?'fav':''}" onclick="toggleFav(event,'${id}');openDetail('${id}')">${f?'♥ Sevimlilarda':'♡ Sevimlilarga'}</button></div>
  <h3>O'xshash ${m.genre.toLowerCase()} kontent</h3><div class="scroller">${sim.map(card).join("")}</div></div>`;
  $("detail").classList.add("open");$("detailBox").scrollTop=0;
}
function playInline(id){const m=byId(id);addHistory(id);const v=$("vid");v.classList.add("live");v.innerHTML=`<iframe src="https://www.youtube.com/embed/${m.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`}
function closeDetail(){$("detail").classList.remove("open");$("detailBox").innerHTML=""}
$("detail").addEventListener("click",e=>{if(e.target==$("detail"))closeDetail()});

function toggleFav(e,id){e.stopPropagation();if(fav.has(id)){fav.delete(id);toast("Sevimlilardan olib tashlandi")}else{fav.add(id);toast("Sevimlilarga qo'shildi ❤️")}save();
  if(!$("detail").classList.contains("open")){S.view=="home"?(renderNav(),renderHero(),document.querySelectorAll(".scroller").forEach(()=>{}),rerenderRows()):render()}}
function rerenderRows(){const y=scrollY;render();scrollTo(0,y)}
function addHistory(id){hist=[id,...hist.filter(h=>h!=id)].slice(0,30);save();renderNav()}
function randomMovie(){openDetail(MOVIES[Math.floor(Math.random()*MOVIES.length)].id)}

function openLogin(){if(S.user){toast("Siz "+S.user+" sifatida kirgansiz");return}$("login").classList.add("open")}
function closeLogin(){$("login").classList.remove("open")}
$("login").addEventListener("click",e=>{if(e.target==$("login"))closeLogin()});
function submitLogin(e){e.preventDefault();S.user=$("ln").value.trim()||"Foydalanuvchi";try{localStorage.setItem("cv2_user",JSON.stringify(S.user))}catch(x){}authUI();closeLogin();toast("Xush kelibsiz, "+S.user+"!");return false}
function authUI(){const b=$("authBtn");b.textContent=S.user?"Chiqish ("+S.user+")":"Kirish";b.onclick=S.user?()=>{S.user=null;try{localStorage.removeItem("cv2_user")}catch(e){}authUI();toast("Tizimdan chiqdingiz")}:openLogin}

$("q").addEventListener("input",function(){S.q=this.value.trim();$("qx").style.display=S.q?"block":"none";render()});
function clearSearch(silent){$("q").value="";S.q="";$("qx").style.display="none";if(!silent)render()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){closeDetail();closeLogin()}});
let tt;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
authUI();render();
</script>
